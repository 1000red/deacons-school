name: deacons_school_mobile
description: "تصميم تطبيق موبايل (Flutter) لمدرسة الشمامسة - نسخة UI فقط بدون ربط بالباك إند."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_pdfview: ^1.4.4
  file_saver: ^0.3.1
  audioplayers: ^6.1.0
  just_audio: ^0.10.4
  dio: ^5.9.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  gal: ^2.3.0 # لحفظ الصور في معرض الصور (Gallery)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  # ios: true
  image_path: "assets/logo-removebg-preview.png"

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/curriculum/third/third_y2/
